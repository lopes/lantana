---
name: Build Cowrie Image

on:
  push:
    branches: [main]
    paths:
      - "containers/cowrie/**"
      - "config/ansible/roles/cowrie/**"
      - ".github/workflows/build-cowrie.yml"
  pull_request:
    paths:
      - "containers/cowrie/**"
      - "config/ansible/roles/cowrie/**"
      - ".github/workflows/build-cowrie.yml"
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cowrie-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/lopes/lantana-cowrie
  CHANNEL_TAG: v1.5
  COWRIE_REF: 8e36327f6a24abe379dac807cc7e8b2d2fb01248
  COWRIE_VERSION: 3.1.7

jobs:
  build-and-verify:
    name: Build & smoke-test lantana-cowrie
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      epoch: ${{ steps.meta.outputs.epoch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - name: Compute upstream short SHA
        id: meta
        run: |
          echo "short_sha=${COWRIE_REF:0:12}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Build local candidate image
        uses: docker/build-push-action@v6
        with:
          context: containers/cowrie
          file: containers/cowrie/Containerfile
          load: true
          tags: lantana-cowrie:ci-test
          build-args: |
            COWRIE_REF=${{ env.COWRIE_REF }}
            COWRIE_VERSION=${{ env.COWRIE_VERSION }}
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test UID/GID, imports, and live SSH healthcheck
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /cowrie/cowrie-env/bin/python3 lantana-cowrie:ci-test -c \
            'import os, cowrie; assert os.getuid() == 999 and os.getgid() == 999, (os.getuid(), os.getgid()); print("UID/GID 999:999 OK")'

          TMPDIR=$(mktemp -d)
          mkdir -p "$TMPDIR/log" "$TMPDIR/var/keys" "$TMPDIR/var/tty" "$TMPDIR/var/downloads" "$TMPDIR/var/misc"
          chmod -R 0777 "$TMPDIR"
          cat > "$TMPDIR/cowrie.cfg" <<'EOF'
          [honeypot]
          hostname = ci-test
          sensor_name = ci-test
          [ssh]
          enabled = true
          listen_endpoints = tcp:2222:interface=0.0.0.0
          [telnet]
          enabled = false
          [output_jsonlog]
          enabled = true
          logfile = /cowrie/cowrie-git/var/log/cowrie/cowrie.json
          EOF

          CID=$(docker run -d --rm \
            --read-only --tmpfs /tmp \
            -v "$TMPDIR/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro" \
            -v "$PWD/config/ansible/roles/cowrie/files/healthcheck.py:/healthcheck.py:ro" \
            -v "$TMPDIR/log:/cowrie/cowrie-git/var/log/cowrie:rw" \
            -v "$TMPDIR/var:/cowrie/cowrie-git/var/lib/cowrie:rw" \
            lantana-cowrie:ci-test)
          trap 'docker stop "$CID" >/dev/null 2>&1 || true; rm -rf "$TMPDIR"' EXIT

          for i in $(seq 1 20); do
            if docker exec "$CID" python3 /healthcheck.py; then
              echo "Cowrie healthcheck passed on attempt $i"
              break
            fi
            if [ "$i" -eq 20 ]; then
              docker logs "$CID"
              exit 1
            fi
            sleep 1
          done

          if docker logs "$CID" 2>&1 | grep -qi "Traceback"; then
            docker logs "$CID"
            exit 1
          fi

  publish:
    name: Publish verified lantana-cowrie to GHCR
    needs: build-and-verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: containers/cowrie
          file: containers/cowrie/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.CHANNEL_TAG }}
            ${{ env.IMAGE_NAME }}:${{ needs.build-and-verify.outputs.short_sha }}
          build-args: |
            COWRIE_REF=${{ env.COWRIE_REF }}
            COWRIE_VERSION=${{ env.COWRIE_VERSION }}
            SOURCE_DATE_EPOCH=${{ needs.build-and-verify.outputs.epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
