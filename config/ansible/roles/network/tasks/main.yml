---
# --- SYSTEM PREPARATION ---
- name: "Enable packet forwarding"
  become: true
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-ip-forwarding.conf
    content: |
      # /etc/sysctl.d/99-ip-forwarding.conf
      # Managed by Ansible

      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
    owner: root
    group: root
    mode: "0644"
  notify: "Reload sysctl"
  tags: [network]

- name: "Check live IPv4 forwarding state"
  become: true
  ansible.builtin.slurp:
    src: /proc/sys/net/ipv4/ip_forward
  register: live_ipv4_forward
  tags: [network]

- name: "Apply packet forwarding sysctl immediately when drifted"
  become: true
  ansible.builtin.command: "sysctl -p /etc/sysctl.d/99-ip-forwarding.conf"
  when: "(live_ipv4_forward.content | b64decode).strip() != '1'"
  changed_when: true
  tags: [network]

# --- FIREWALL DEFINITIONS ---
- name: "Deploy network variables for nftables"
  become: true
  ansible.builtin.template:
    src: "network-{{ lantana.mode }}.nft.j2"
    dest: /etc/lantana/honeywall/nftables/network.nft
    owner: root
    group: root
    mode: "0600"
  notify: "Reload nftables"
  tags: [network, nftables]

- name: "Enable nftables service"
  become: true
  ansible.builtin.service:
    name: nftables
    state: started
    enabled: true
  tags: [network, nftables]

# --- MODE SPECIFIC CONFIGURATION ---
- name: "Configure Single Node specific networking"
  ansible.builtin.include_tasks: single_node.yml
  when: lantana.mode == "single"
  tags: [network]

- name: "Configure Multi Node specific networking"
  ansible.builtin.include_tasks: multi_node.yml
  when: lantana.mode == "multi"
  tags: [network]
