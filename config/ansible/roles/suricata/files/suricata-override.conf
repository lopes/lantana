# /etc/systemd/system/suricata.service.d/override.conf
# Managed by Ansible
# Run Suricata directly as the unprivileged `suricata` service user with only
# the capabilities required for AF_PACKET capture and thread priority.

[Service]
Type=simple
User=suricata
Group=suricata
AmbientCapabilities=CAP_NET_RAW CAP_NET_ADMIN CAP_SYS_NICE
CapabilityBoundingSet=CAP_NET_RAW CAP_NET_ADMIN CAP_SYS_NICE
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
ReadWritePaths=/var/log/lantana/honeywall/suricata /var/lib/lantana/honeywall/suricata -/run/suricata
RestrictAddressFamilies=AF_PACKET AF_UNIX AF_INET AF_INET6 AF_NETLINK
PIDFile=
ExecStart=
ExecStart=/usr/bin/suricata --af-packet -c /etc/suricata/suricata.yaml
ExecReload=
ExecReload=/bin/kill -USR2 $MAINPID
ExecStop=
