---
# --- SURICATA INSTALLATION & SERVICE ACCOUNT ---
- name: "Install Suricata"
  become: true
  ansible.builtin.apt:
    name: suricata
    state: present
  tags: [suricata]

- name: "Ensure suricata system group exists"
  become: true
  ansible.builtin.group:
    name: suricata
    system: true
    state: present
  tags: [suricata]

- name: "Ensure suricata system user exists"
  become: true
  ansible.builtin.user:
    name: suricata
    group: suricata
    shell: /usr/sbin/nologin
    create_home: false
    system: true
    state: present
  tags: [suricata]

# --- SURICATA DIRECTORIES ---
- name: "Create Suricata rule directory"
  become: true
  ansible.builtin.file:
    path: /var/lib/lantana/honeywall/suricata/rules
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  tags: [suricata]

- name: "Create Suricata runtime directories"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "suricata"
    group: "suricata"
    mode: "0750"
  loop:
    - /var/log/lantana/honeywall/suricata
    - /var/lib/lantana/honeywall/suricata/files
  tags: [suricata]

- name: "Grant Vector read-only POSIX ACL on Suricata log directory"
  become: true
  ansible.builtin.shell: |
    set -eu
    setfacl -R -P -m u:vector:rX /var/log/lantana/honeywall/suricata
    setfacl -d -m u:vector:rX /var/log/lantana/honeywall/suricata
  changed_when: false
  tags: [suricata, vector]

# --- NIC OFFLOAD HARDENING (TX/GRO/GSO/TSO) ---
- name: "Probe WAN NIC offload capabilities"
  become: true
  ansible.builtin.command: "ethtool -k {{ network.honeywall.wan.interface }}"
  register: suricata_wan_offload_probe
  changed_when: false
  failed_when: false
  tags: [suricata]

- name: "Determine whether WAN TX checksum offload is fixed"
  ansible.builtin.set_fact:
    suricata_tx_offload_fixed: >-
      {{
        (suricata_wan_offload_probe.rc != 0) or
        ('tx-checksumming: on [fixed]' in suricata_wan_offload_probe.stdout) or
        ('tx-checksum-ip-generic: on [fixed]' in suricata_wan_offload_probe.stdout)
      }}
  tags: [suricata]

- name: "Set Suricata stream checksum validation policy"
  ansible.builtin.set_fact:
    suricata_checksum_validation: "{{ not (suricata_tx_offload_fixed | bool) }}"
  tags: [suricata]

- name: "Deploy persistent WAN NIC offload service"
  become: true
  ansible.builtin.template:
    src: lantana-nic-offload.service.j2
    dest: /etc/systemd/system/lantana-nic-offload.service
    owner: root
    group: root
    mode: "0644"
  notify: "Reload systemd"
  tags: [suricata]

- name: "Enable and start WAN NIC offload service"
  become: true
  ansible.builtin.systemd:
    name: lantana-nic-offload.service
    enabled: true
    state: started
    daemon_reload: true
  tags: [suricata]

# --- SURICATA CONFIGURATION ---
- name: "Create empty rule stubs to pass initial validation"
  become: true
  ansible.builtin.copy:
    dest: "/var/lib/lantana/honeywall/suricata/rules/{{ item }}"
    content: ""
    force: false
    owner: "root"
    group: "root"
    mode: "0644"
  loop:
    - lantana.rules
    - suricata.rules
  tags: [suricata]

- name: "Create Suricata's disable.conf with unsupported protocols"
  become: true
  ansible.builtin.copy:
    dest: /etc/suricata/disable.conf
    content: |
      # /etc/suricata/disable.conf
      # Managed by Ansible
      # Debian 13 Suricata binary lacks compiled support for these protocols.
      re:dnp3
      re:modbus
      re:enip
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart Suricata"
  tags: [suricata]

- name: "Deploy Suricata configuration"
  become: true
  ansible.builtin.template:
    src: suricata.yaml.j2
    dest: /etc/suricata/suricata.yaml
    owner: root
    group: root
    mode: "0644"
    # Pass -l /tmp so root-run `suricata -T` never creates a root-owned eve.json
    # inside /var/log/lantana/honeywall/suricata (which would cause EACCES when
    # the non-root suricata.service starts).
    validate: /usr/bin/suricata -T -c %s -l /tmp
  notify: "Restart Suricata"
  tags: [suricata]

# --- SURICATA LOGGING ---
- name: "Configure log rotation for Suricata"
  become: true
  ansible.builtin.copy:
    src: suricata.logrotate
    dest: /etc/lantana/logrotate.d/00_00/suricata
    owner: root
    group: root
    mode: "0644"
  tags: [suricata]

- name: "Deploy Vector configuration"
  become: true
  ansible.builtin.template:
    src: suricata.vector.yaml.j2
    dest: /etc/vector/conf.d/suricata.yaml
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - "Validate Vector config tree"
    - "Restart Vector"
  tags: [suricata, vector]

# --- SURICATA ENABLEMENT ---
- name: "Deploy custom Lantana Suricata rules"
  become: true
  ansible.builtin.copy:
    src: lantana.rules
    dest: /var/lib/lantana/honeywall/suricata/rules/lantana.rules
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart Suricata"
  tags: [suricata]

- name: "Update Suricata rules"
  become: true
  ansible.builtin.command: "suricata-update --data-dir /var/lib/lantana/honeywall/suricata"
  register: suricata_update
  changed_when: "'Writing rules to' in suricata_update.stdout"
  notify: "Restart Suricata"
  tags: [suricata]

- name: "Create Suricata systemd override directory"
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/suricata.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [suricata]

- name: "Configure Suricata systemd non-root override"
  become: true
  ansible.builtin.copy:
    src: suricata-override.conf
    dest: /etc/systemd/system/suricata.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - "Reload systemd"
    - "Restart Suricata"
  tags: [suricata]

- name: "Ensure Suricata runtime directories and log files are owned by suricata"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "suricata"
    group: "suricata"
    recurse: true
  loop:
    - /var/log/lantana/honeywall/suricata
    - /var/lib/lantana/honeywall/suricata/files
  tags: [suricata]

- name: "Ensure Suricata is enabled and started"
  become: true
  ansible.builtin.systemd:
    name: suricata
    state: started
    enabled: true
    daemon_reload: true
  tags: [suricata]
