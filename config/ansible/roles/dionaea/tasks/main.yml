---
# --- SYSTEM PREPARATION ---
- name: "Create Dionaea configuration directory"
  become: true
  ansible.builtin.file:
    path: /etc/lantana/sensor/dionaea
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  tags: [dionaea]

- name: "Create Dionaea log directory"
  become: true
  ansible.builtin.file:
    path: /var/log/lantana/sensor/dionaea
    state: directory
    owner: "{{ system.users.sensor.name }}"
    group: "{{ system.users.sensor.name }}"
    mode: "0750"
  tags: [dionaea]

- name: "Grant Vector read-only POSIX ACL on Dionaea log directory"
  become: true
  ansible.builtin.shell: |
    set -eu
    setfacl -R -P -m u:vector:rX /var/log/lantana/sensor/dionaea
    setfacl -d -m u:vector:rX /var/log/lantana/sensor/dionaea
  changed_when: false
  tags: [dionaea, vector]

- name: "Create Dionaea state directory"
  become: true
  ansible.builtin.file:
    path: /var/lib/lantana/sensor/dionaea
    state: directory
    owner: "{{ system.users.sensor.name }}"
    group: "{{ system.users.sensor.name }}"
    mode: "0755"
  tags: [dionaea]

- name: "Create Dionaea artifact directories"
  become: true
  ansible.builtin.file:
    path: "{{ _dionaea_dir }}"
    state: directory
    owner: "{{ system.users.sensor.name }}"
    group: "{{ system.users.sensor.name }}"
    mode: "0755"
  loop:
    - /var/lib/lantana/sensor/dionaea/binaries
    - /var/lib/lantana/sensor/dionaea/bistreams
    - /var/lib/lantana/sensor/dionaea/wwwroot
    - /var/lib/lantana/sensor/dionaea/tmp
  loop_control:
    loop_var: _dionaea_dir
  tags: [dionaea]

- name: "Grant collector POSIX ACL on Dionaea scratch directories (single-node)"
  become: true
  ansible.builtin.command:
    cmd: >-
      /usr/local/sbin/lantana-grant-read
      /var/lib/lantana/sensor/dionaea/binaries
      /var/lib/lantana/sensor/dionaea/bistreams
      /var/lib/lantana/sensor/dionaea/tmp
  when: lantana.mode != "multi"
  changed_when: false
  tags: [dionaea]

- name: "Enable linger for sensor-user"
  become: true
  ansible.builtin.command: "loginctl enable-linger {{ system.users.sensor.name }}"
  args:
    creates: "/var/lib/systemd/linger/{{ system.users.sensor.name }}"
  tags: [dionaea]

# --- CONFIGURATION FILES ---
# The self-owned lantana-dionaea image bakes /opt/dionaea/etc/dionaea/dionaea.cfg
# (processors=filter_emu, disabling bistreams) and ships the lantana_json
# ihandler. Ansible mounts services-enabled/ and ihandlers-enabled/ read-only
# so only our catalog services + lantana_json/store ihandlers load.

- name: "Remove legacy host-side dionaea.cfg override (baked in image)"
  become: true
  ansible.builtin.file:
    path: /etc/lantana/sensor/dionaea/dionaea.cfg
    state: absent
  notify: "Restart Dionaea container"
  tags: [dionaea]

- name: "Create Dionaea per-service config directories on host"
  become: true
  ansible.builtin.file:
    path: "{{ _dionaea_cfg_dir }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  loop:
    - /etc/lantana/sensor/dionaea/services-enabled
    - /etc/lantana/sensor/dionaea/ihandlers-enabled
  loop_control:
    loop_var: _dionaea_cfg_dir
  tags: [dionaea]

- name: "Render Dionaea per-service config files"
  become: true
  ansible.builtin.template:
    src: "services-enabled/{{ _svc }}.yaml.j2"
    dest: "/etc/lantana/sensor/dionaea/services-enabled/{{ _svc }}.yaml"
    owner: "root"
    group: "root"
    mode: "0644"
    validate: python3 -c "import sys; open(sys.argv[1], encoding='ascii').read()" %s
  loop: "{{ dionaea_service_catalog.keys() | list }}"
  loop_control:
    loop_var: _svc
  notify: "Restart Dionaea container"
  tags: [dionaea]

# Catalog idempotency: when a service is removed from
# `dionaea_service_catalog`, its yaml file from the prior apply would
# persist on disk and dionaea would keep loading it. Sweep
# services-enabled and remove any *.yaml whose basename isn't in the
# current catalog.
- name: "Find existing per-service yamls on host"
  become: true
  ansible.builtin.find:
    paths: /etc/lantana/sensor/dionaea/services-enabled
    patterns: "*.yaml"
  register: _existing_svc_yamls
  tags: [dionaea]

- name: "Remove stale per-service yamls (catalog drift)"
  become: true
  ansible.builtin.file:
    path: "{{ _yaml_file.path }}"
    state: absent
  loop: "{{ _existing_svc_yamls.files }}"
  loop_control:
    loop_var: _yaml_file
    label: "{{ _yaml_file.path | basename }}"
  when: "(_yaml_file.path | basename | regex_replace('\\.yaml$', '')) not in dionaea_service_catalog"
  notify: "Restart Dionaea container"
  tags: [dionaea]

- name: "Remove legacy log_json ihandler config (replaced by lantana_json)"
  become: true
  ansible.builtin.file:
    path: /etc/lantana/sensor/dionaea/ihandlers-enabled/log_json.yaml
    state: absent
  notify: "Restart Dionaea container"
  tags: [dionaea]

- name: "Render Dionaea lantana_json ihandler"
  become: true
  ansible.builtin.template:
    src: "ihandlers-enabled/lantana_json.yaml.j2"
    dest: /etc/lantana/sensor/dionaea/ihandlers-enabled/lantana_json.yaml
    owner: "root"
    group: "root"
    mode: "0644"
    validate: python3 -c "import sys; open(sys.argv[1], encoding='ascii').read()" %s
  notify: "Restart Dionaea container"
  tags: [dionaea]

# The `store` ihandler is bundled with dionaea and writes attacker-
# delivered binaries to /opt/dionaea/var/lib/dionaea/binaries/ (mapped
# to /var/lib/lantana/sensor/dionaea/binaries/ on the host). Without
# this ihandler, downloaded binaries are received then discarded.
- name: "Render Dionaea store ihandler"
  become: true
  ansible.builtin.template:
    src: "ihandlers-enabled/store.yaml.j2"
    dest: /etc/lantana/sensor/dionaea/ihandlers-enabled/store.yaml
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart Dionaea container"
  tags: [dionaea]

- name: "Deploy persona-consistent HTTP wwwroot index page"
  become: true
  ansible.builtin.template:
    src: "wwwroot/index.html.j2"
    dest: /var/lib/lantana/sensor/dionaea/wwwroot/index.html
    owner: "{{ system.users.sensor.name }}"
    group: "{{ system.users.sensor.name }}"
    mode: "0644"
  when: "'http' in dionaea_service_catalog"
  tags: [dionaea]

- name: "Deploy Dionaea application-layer health check script"
  become: true
  ansible.builtin.copy:
    src: healthcheck.py
    dest: /etc/lantana/sensor/dionaea/healthcheck.py
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart Dionaea container"
  tags: [dionaea]

- name: "Create Quadlet directory for sensor user"
  become: true
  ansible.builtin.file:
    path: "/etc/containers/systemd/users/{{ system.users.sensor.uid }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  tags: [dionaea]

- name: "Deploy Quadlet definition"
  become: true
  ansible.builtin.template:
    src: dionaea.container.j2
    dest: "/etc/containers/systemd/users/{{ system.users.sensor.uid }}/dionaea.container"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart Dionaea container"
  tags: [dionaea]

- name: "Reload user systemd daemon for Quadlet"
  become: true
  become_user: "{{ system.users.sensor.name }}"
  ansible.builtin.command:
    cmd: systemctl --user daemon-reload
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ system.users.sensor.uid }}"
  changed_when: false
  tags: [dionaea]

- name: "Start Dionaea container"
  become: true
  become_user: "{{ system.users.sensor.name }}"
  ansible.builtin.systemd:
    name: "dionaea"
    state: started
    enabled: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ system.users.sensor.uid }}"
  tags: [dionaea]

# Re-apply Vector and collector POSIX ACLs after container start so any newly
# created subdirectories or log files inherit immediate read/prune access
# without waiting for the 00:10 UTC cron.
- name: "Re-apply Vector read-only POSIX ACL on Dionaea log directory after start"
  become: true
  ansible.builtin.shell: |
    set -eu
    setfacl -R -P -m u:vector:rX /var/log/lantana/sensor/dionaea
    setfacl -d -m u:vector:rX /var/log/lantana/sensor/dionaea
  changed_when: false
  tags: [dionaea, vector]

- name: "Re-apply collector POSIX ACL on Dionaea scratch directories after start (single-node)"
  become: true
  ansible.builtin.command:
    cmd: >-
      /usr/local/sbin/lantana-grant-read
      /var/lib/lantana/sensor/dionaea/binaries
      /var/lib/lantana/sensor/dionaea/bistreams
      /var/lib/lantana/sensor/dionaea/tmp
  when: lantana.mode != "multi"
  changed_when: false
  tags: [dionaea]

- name: "Publish the Dionaea ports (single-node)"
  become: true
  ansible.builtin.template:
    src: dionaea.nft.j2
    dest: /etc/lantana/honeywall/nftables/sensors/dionaea.nft
    owner: "root"
    group: "root"
    mode: "0600"
  when: lantana.mode != "multi"
  notify: "Reload nftables"
  tags: [dionaea, nftables]

- name: "Publish the Dionaea ports on honeywall nodes (multi-node)"
  become: true
  ansible.builtin.template:
    src: dionaea.nft.j2
    dest: /etc/lantana/honeywall/nftables/sensors/dionaea.nft
    owner: "root"
    group: "root"
    mode: "0600"
  delegate_to: "{{ item }}"
  loop: "{{ groups['honeywall_nodes'] }}"
  when:
    - lantana.mode == "multi"
    - groups['honeywall_nodes'] is defined
  notify: "Reload nftables"
  tags: [dionaea, nftables]

# --- PIPELINE BRIDGE ---
# Refresh POSIX ACLs (u:nectar:rwX via lantana-grant-read) at 00:10 UTC so
# nectar has read and prune rights before 00:15 prune and 01:00 enrich without
# altering stigma ownership or mode bits.
- name: "Schedule daily ACL refresh for Dionaea scratch directories (single-node)"
  become: true
  ansible.builtin.copy:
    dest: /etc/cron.d/lantana-dionaea-binaries
    content: |
      # Grant nectar rwX ACL on Dionaea scratch dirs before 00:15 prune and 01:00 enrich.
      10 0 * * * root /usr/local/sbin/lantana-grant-read /var/lib/lantana/sensor/dionaea/binaries /var/lib/lantana/sensor/dionaea/bistreams /var/lib/lantana/sensor/dionaea/tmp
    owner: root
    group: root
    mode: "0644"
  when: lantana.mode != "multi"
  tags: [dionaea]

# --- LOGGING ---
- name: "Deploy Vector configuration"
  become: true
  ansible.builtin.template:
    src: dionaea.vector.yaml.j2
    dest: /etc/vector/conf.d/dionaea.yaml
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - "Validate Vector config tree"
    - "Restart Vector"
  tags: [dionaea, vector]
