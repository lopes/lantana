# /etc/rsyslog.d/10-nftables.conf
# Managed by Ansible
# Restrict to kernel facility so unprivileged local processes (e.g. a
# compromised stigma container writing to /dev/log) cannot spoof [LANTANA_*]
# firewall logs, poison Bronze, or flood firewall.log.

if $syslogfacility-text == 'kern' and ($msg contains '[LANTANA_OUTPUT_DROP_SENSOR_' or $msg contains '[LANTANA_FORWARD_DROP_EGRESS]') then {
    action(
        type="omfile"
        File="/var/log/lantana/honeywall/nftables/sensor-egress.log"
        FileCreateMode="0644"
        DirCreateMode="0755"
    )
    stop
}

if $syslogfacility-text == 'kern' and $msg contains '[LANTANA_' then {
    action(
        type="omfile"
        File="/var/log/lantana/honeywall/nftables/firewall.log"
        FileCreateMode="0644"
        DirCreateMode="0755"
    )
    stop
}
