---
# --- FIREWALL LOGGING ---
- name: "Suppress kernel info/notice firewall logs on KVM console"
  become: true
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-lantana-console.conf
    content: |
      # Managed by Ansible
      # Keep real kernel warnings/errors (<= 4) on console while preventing
      # level-info (6) nftables drop logs from flooding KVM /dev/tty0.
      kernel.printk = 4 4 1 4
    owner: root
    group: root
    mode: "0644"
  notify: "Reload sysctl"
  tags: [nftables]

- name: "Check live kernel.printk console loglevel"
  become: true
  ansible.builtin.slurp:
    src: /proc/sys/kernel/printk
  register: live_kernel_printk
  tags: [nftables]

- name: "Apply KVM console printk sysctl immediately when drifted"
  become: true
  ansible.builtin.command: "sysctl -p /etc/sysctl.d/99-lantana-console.conf"
  when: "not (live_kernel_printk.content | b64decode).startswith('4')"
  changed_when: true
  tags: [nftables]

- name: "Ensure firewall log directory exists"
  become: true
  ansible.builtin.file:
    path: /var/log/lantana/honeywall/nftables
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [nftables]

- name: "Initialize dedicated sensor-egress log file"
  become: true
  ansible.builtin.copy:
    content: ""
    dest: /var/log/lantana/honeywall/nftables/sensor-egress.log
    force: false
    owner: root
    group: root
    mode: "0644"
  tags: [nftables]

- name: "Setup firewall connections logging"
  become: true
  ansible.builtin.copy:
    src: 10-nftables.conf
    dest: /etc/rsyslog.d/
    owner: root
    group: root
    mode: "0644"
  notify: "Restart rsyslog"
  tags: [nftables]

- name: "Check whether rsyslog loaded 10-nftables.conf"
  become: true
  ansible.builtin.shell: |
    set -eu
    conf_mtime=$(stat -c %Y /etc/rsyslog.d/10-nftables.conf)
    rsyslog_ts=$(systemctl show rsyslog.service --property=ActiveEnterTimestamp --value)
    if [ -z "$rsyslog_ts" ]; then
      echo stale
      exit 0
    fi
    rsyslog_epoch=$(date -d "$rsyslog_ts" +%s 2>/dev/null || echo 0)
    if [ "$conf_mtime" -gt "$rsyslog_epoch" ]; then
      echo stale
    else
      echo fresh
    fi
  register: rsyslog_nftables_state
  changed_when: false
  tags: [nftables]

- name: "Restart rsyslog when 10-nftables.conf post-dates last rsyslog start"
  become: true
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
    enabled: true
  when: rsyslog_nftables_state.stdout | trim == "stale"
  tags: [nftables]

- name: "Setup log rotation of firewall connections"
  become: true
  ansible.builtin.copy:
    src: firewall.logrotate
    dest: /etc/lantana/logrotate.d/00_00/firewall
    owner: root
    group: root
    mode: "0644"
  tags: [nftables]

- name: "Deploy Vector configuration"
  become: true
  ansible.builtin.template:
    src: firewall.vector.yaml.j2
    dest: /etc/vector/conf.d/firewall.yaml
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - "Validate Vector config tree"
    - "Restart Vector"
  tags: [nftables, vector]

# --- MODE SPECIFIC CONFIGURATION ---
- name: "Configure single node firewall"
  ansible.builtin.include_tasks: single_node.yml
  when: lantana.mode == "single"
  tags: [nftables]

- name: "Configure multi node firewall"
  ansible.builtin.include_tasks: multi_node.yml
  when: lantana.mode == "multi"
  tags: [nftables]
