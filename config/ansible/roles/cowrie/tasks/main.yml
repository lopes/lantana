---
# --- SYSTEM PREPARATION ---
- name: "Create Cowrie configuration directory"
  become: true
  ansible.builtin.file:
    path: /etc/lantana/sensor/cowrie
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  tags: [cowrie]

- name: "Create Cowrie log directory"
  become: true
  ansible.builtin.file:
    path: /var/log/lantana/sensor/cowrie
    state: directory
    owner: "{{ system.users.sensor.name }}"
    group: "{{ system.users.sensor.name }}"
    mode: "0750"
  tags: [cowrie]

- name: "Grant Vector read-only POSIX ACL on Cowrie log directory"
  become: true
  ansible.builtin.shell: |
    set -eu
    setfacl -R -P -m u:vector:rX /var/log/lantana/sensor/cowrie
    setfacl -d -m u:vector:rX /var/log/lantana/sensor/cowrie
  changed_when: false
  tags: [cowrie, vector]

- name: "Create Cowrie state directory"
  become: true
  ansible.builtin.file:
    path: /var/lib/lantana/sensor/cowrie
    state: directory
    owner: "{{ system.users.sensor.name }}"
    group: "{{ system.users.sensor.name }}"
    mode: "0755"
  tags: [cowrie]

- name: "Create Cowrie artifact directories"
  become: true
  ansible.builtin.file:
    path: "{{ _cowrie_dir }}"
    state: directory
    owner: "{{ system.users.sensor.name }}"
    group: "{{ system.users.sensor.name }}"
    mode: "0775"
  loop:
    - /var/lib/lantana/sensor/cowrie/keys
    - /var/lib/lantana/sensor/cowrie/tty
    - /var/lib/lantana/sensor/cowrie/downloads
    - /var/lib/lantana/sensor/cowrie/misc
  loop_control:
    loop_var: _cowrie_dir
  tags: [cowrie]

- name: "Grant collector POSIX ACL on Cowrie scratch directories (single-node)"
  become: true
  ansible.builtin.command:
    cmd: >-
      /usr/local/sbin/lantana-grant-read
      /var/lib/lantana/sensor/cowrie/downloads
      /var/lib/lantana/sensor/cowrie/tty
  when: lantana.mode != "multi"
  changed_when: false
  tags: [cowrie]

- name: "Enable linger for sensor-user"
  become: true
  ansible.builtin.command: "loginctl enable-linger {{ system.users.sensor.name }}"
  args:
    creates: "/var/lib/systemd/linger/{{ system.users.sensor.name }}"
  tags: [cowrie]

# --- CONFIGURATION FILES ---
- name: "Deploy Cowrie configuration template"
  become: true
  ansible.builtin.template:
    src: "cowrie.cfg.j2"
    dest: /etc/lantana/sensor/cowrie/cowrie.cfg
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart Cowrie container"
  tags: [cowrie]

- name: "Deploy Cowrie health check script"
  become: true
  ansible.builtin.copy:
    src: healthcheck.py
    dest: /etc/lantana/sensor/cowrie/healthcheck.py
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart Cowrie container"
  tags: [cowrie]

- name: "Create Quadlet directory for sensor user"
  become: true
  ansible.builtin.file:
    path: "/etc/containers/systemd/users/{{ system.users.sensor.uid }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  tags: [cowrie]

- name: "Deploy Quadlet definition"
  become: true
  ansible.builtin.template:
    src: cowrie.container.j2
    dest: "/etc/containers/systemd/users/{{ system.users.sensor.uid }}/cowrie.container"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: "Restart Cowrie container"
  tags: [cowrie]

- name: "Reload user systemd daemon for Quadlet"
  become: true
  become_user: "{{ system.users.sensor.name }}"
  ansible.builtin.command:
    cmd: systemctl --user daemon-reload
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ system.users.sensor.uid }}"
  changed_when: false
  tags: [cowrie]

- name: "Start Cowrie container"
  become: true
  become_user: "{{ system.users.sensor.name }}"
  ansible.builtin.systemd:
    name: "cowrie"
    state: started
    enabled: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ system.users.sensor.uid }}"
  tags: [cowrie]

- name: "Publish the Cowrie ports (single-node)"
  become: true
  ansible.builtin.template:
    src: cowrie.nft.j2
    dest: /etc/lantana/honeywall/nftables/sensors/cowrie.nft
    owner: "root"
    group: "root"
    mode: "0600"
  when: lantana.mode != "multi"
  notify: "Reload nftables"
  tags: [cowrie, nftables]

- name: "Publish the Cowrie ports on honeywall nodes (multi-node)"
  become: true
  ansible.builtin.template:
    src: cowrie.nft.j2
    dest: /etc/lantana/honeywall/nftables/sensors/cowrie.nft
    owner: "root"
    group: "root"
    mode: "0600"
  delegate_to: "{{ item }}"
  loop: "{{ groups['honeywall_nodes'] }}"
  when:
    - lantana.mode == "multi"
    - groups['honeywall_nodes'] is defined
  notify: "Reload nftables"
  tags: [cowrie, nftables]

# --- LOGGING ---
- name: "Deploy Vector configuration"
  become: true
  ansible.builtin.template:
    src: cowrie.vector.yaml.j2
    dest: /etc/vector/conf.d/cowrie.yaml
    owner: "root"
    group: "root"
    mode: "0644"
  notify:
    - "Validate Vector config tree"
    - "Restart Vector"
  tags: [cowrie, vector]

# --- PIPELINE BRIDGE ---
# Cowrie writes downloaded malware files at mode 0600 via Python's tempfile
# module (which masks inherited default ACLs to ---). Running lantana-grant-read
# at 00:10 UTC (before 00:15 prune and 01:00 enrich) recalculates POSIX ACL
# masks for nectar (u:nectar:rwX) without touching owner/group bits or following
# symlinks.
- name: "Schedule daily ACL refresh for Cowrie scratch directories (single-node)"
  become: true
  ansible.builtin.copy:
    dest: /etc/cron.d/lantana-cowrie-downloads
    content: |
      # Grant nectar rwX ACL on Cowrie downloads and tty before 00:15 prune and 01:00 enrich.
      10 0 * * * root /usr/local/sbin/lantana-grant-read /var/lib/lantana/sensor/cowrie/downloads /var/lib/lantana/sensor/cowrie/tty
    owner: root
    group: root
    mode: "0644"
  when: lantana.mode != "multi"
  tags: [cowrie]
