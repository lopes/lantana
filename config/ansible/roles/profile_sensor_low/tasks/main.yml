---
# --- CONTAINER USER ---
- name: "Manage container user group"
  become: true
  ansible.builtin.group:
    gid: "{{ system.users.sensor.uid }}"
    name: "{{ system.users.sensor.name }}"
    state: present
  tags: [honeypots]

- name: "Manage container system user"
  become: true
  ansible.builtin.user:
    uid: "{{ system.users.sensor.uid }}"
    name: "{{ system.users.sensor.name }}"
    group: "{{ system.users.sensor.name }}"
    shell: /usr/sbin/nologin
    create_home: true
    system: true
    state: present
  tags: [honeypots]

- name: "Ensure sensor-user has subuid/subgid for rootless Podman"
  become: true
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ system.users.sensor.name }}"
    line: "{{ system.users.sensor.name }}:100000:65536"
    create: true
    owner: "root"
    group: "root"
    mode: "0644"
  loop:
    - /etc/subgid
    - /etc/subuid
  tags: [honeypots]

# --- SENSOR DIRECTORIES ---
- name: "Create sensor config directory"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"
  loop:
    - /etc/lantana/sensor
  tags: [honeypots]

- name: "Create sensor log directory"
  become: true
  ansible.builtin.file:
    path: /var/log/lantana/sensor
    state: directory
    owner: "{{ system.users.sensor.name }}"
    group: "{{ system.users.sensor.name }}"
    mode: "0755"
  tags: [honeypots]

- name: "Create private sensor state directory (strictly stigma-only)"
  become: true
  ansible.builtin.file:
    path: /var/lib/lantana/sensor
    state: directory
    owner: "{{ system.users.sensor.name }}"
    group: "{{ system.users.sensor.name }}"
    mode: "0700"
  tags: [honeypots]

# --- HONEYPOTS LOG ROTATION --
- name: "Set the honeypots log rotation"
  become: true
  ansible.builtin.template:
    src: honeypots.logrotate.j2
    dest: /etc/lantana/logrotate.d/00_00/honeypots
    owner: root
    group: root
    mode: "0644"
  tags: [honeypots]

# --- PODMAN INSTALLATION ---
- name: "Install podman"
  become: true
  ansible.builtin.apt:
    name: podman
  tags: [honeypots]

# --- UNPRIVILEGED SENSOR SCRATCH PRUNING ---
# Runs strictly as stigma under a root-owned systemd unit (/etc/systemd/system)
# on both single-node and multi-node deployments, keeping stigma -> nectar
# isolation strictly one-way (nectar never traverses or unlinks sensor trees).
- name: "Ensure /usr/local/libexec directory exists"
  become: true
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [honeypots]

- name: "Deploy unprivileged sensor scratch prune script"
  become: true
  ansible.builtin.copy:
    src: lantana-sensor-prune
    dest: /usr/local/libexec/lantana-sensor-prune
    owner: root
    group: root
    mode: "0755"
  tags: [honeypots]

- name: "Deploy lantana-sensor-prune systemd service unit"
  become: true
  ansible.builtin.template:
    src: lantana-sensor-prune.service.j2
    dest: /etc/systemd/system/lantana-sensor-prune.service
    owner: root
    group: root
    mode: "0644"
  notify: "Reload systemd"
  tags: [honeypots]

- name: "Deploy lantana-sensor-prune systemd timer unit"
  become: true
  ansible.builtin.template:
    src: lantana-sensor-prune.timer.j2
    dest: /etc/systemd/system/lantana-sensor-prune.timer
    owner: root
    group: root
    mode: "0644"
  notify: "Reload systemd"
  tags: [honeypots]

- name: "Enable and start lantana-sensor-prune systemd timer"
  become: true
  ansible.builtin.systemd:
    name: lantana-sensor-prune.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [honeypots]

- name: "Remove legacy root-run systemd-tmpfiles sensor cleanup config"
  become: true
  ansible.builtin.file:
    path: /etc/tmpfiles.d/lantana-sensor.conf
    state: absent
  tags: [honeypots]

- name: "Strip stale collector POSIX ACLs from sensor state tree (upgrade cleanup)"
  become: true
  become_user: "{{ system.users.sensor.name }}"
  ansible.builtin.shell: |
    set -eu
    if [ -d /var/lib/lantana/sensor ]; then
      setfacl -R -P -x "u:{{ system.users.collector.name }}" /var/lib/lantana/sensor 2>/dev/null || true
      setfacl -R -P -x "d:u:{{ system.users.collector.name }}" /var/lib/lantana/sensor 2>/dev/null || true
    fi
  changed_when: false
  tags: [honeypots]

# --- LOG FORWARDING ---
- name: "Deploy Vector forwarder configuration"
  become: true
  ansible.builtin.template:
    src: forward.vector.yaml.j2
    dest: /etc/vector/conf.d/forward-sensor.yaml
    owner: "root"
    group: "root"
    mode: "0644"
  when: lantana.mode != "single"
  notify:
    - "Validate Vector config tree"
    - "Restart Vector"
  tags: [honeypots, vector]

- name: "Remove duplicate sensor Vector forwarder on single-node hosts"
  become: true
  ansible.builtin.file:
    path: /etc/vector/conf.d/forward-sensor.yaml
    state: absent
  when: lantana.mode == "single"
  notify:
    - "Validate Vector config tree"
    - "Restart Vector"
  tags: [honeypots, vector]
