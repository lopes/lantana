---
# Active post-deploy canary tests for single-node Lantana deployments.
# Unlike validate-sensor-runtime.yml (strictly read-only), this playbook
# injects controlled synthetic probes to prove end-to-end telemetry fidelity:
#
#   1. Vector 1-in-1-out + Layer-1 OPSEC edge filtering:
#      Appends 4 synthetic Cowrie JSON lines with a unique canary_id:
#        - 1 external RFC 5737 test IP (198.51.100.250) -> MUST appear ONCE in Bronze
#        - 1 IPv6 loopback (::1)                        -> MUST appear 0 times
#        - 1 RFC 1918 private IP (10.99.99.99)          -> MUST appear 0 times
#        - 1 host WAN IPv4                              -> MUST appear 0 times
#   2. Suricata external SSH-2.0-Go canary:
#      Opens a real TCP connection from the Ansible controller to WAN:22 and
#      sends an SSH-2.0-Go banner -> asserts sid:9000004 fires in eve.json and
#      lands in Bronze (proving HOME_NET + TX offload + AF_PACKET + Vector).
#   3. Sensor (stigma) 100% dark egress containment canary:
#      Probes RFC 5737 198.51.100.250:{443,80,53} and loopback 127.0.0.1:1
#      as stigma -> asserts every attempt is blocked, logged to sensor-egress.log
#      under [LANTANA_OUTPUT_DROP_SENSOR_WAN] / [LANTANA_OUTPUT_DROP_SENSOR_LO],
#      and ZERO egress canary lines leak into firewall.log or Bronze dataset=nftables.
#
# Usage (from config/ansible/):
#   ansible-playbook -i inventories/<op>/inventory.yml tests/validate-canaries.yml

- name: "VALIDATION: Active Telemetry & IDS Canaries"
  hosts: single_nodes
  gather_facts: false
  vars:
    target_date: "{{ lookup('pipe', 'date -u +%Y-%m-%d') }}"
    datalake_root: /var/lib/lantana/datalake
    wan_ipv4: "{{ network.honeywall.wan.ipv4.split('/')[0] }}"
    cowrie_bronze: "{{ datalake_root }}/bronze/dataset=cowrie/date={{ target_date }}/server={{ inventory_hostname }}/events.json"
    suricata_eve: /var/log/lantana/honeywall/suricata/eve.json
    suricata_bronze: "{{ datalake_root }}/bronze/dataset=suricata/date={{ target_date }}/server={{ inventory_hostname }}/events.json"
    firewall_log: /var/log/lantana/honeywall/nftables/firewall.log
    sensor_egress_log: /var/log/lantana/honeywall/nftables/sensor-egress.log
    nftables_bronze: "{{ datalake_root }}/bronze/dataset=nftables/date={{ target_date }}/server={{ inventory_hostname }}/events.json"

  pre_tasks:
    - name: "Load network variables from inventory"
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all/network.yml"

    - name: "Freeze deterministic canary ID for this play"
      ansible.builtin.set_fact:
        canary_id: "lantana-canary-{{ lookup('pipe', 'date -u +%s') }}"

  tasks:
    # === 1. Vector 1-in-1-out & Layer-1 Edge Filter Canary ===
    - name: "Inject 4 synthetic Vector canary lines into cowrie.json"
      become: true
      ansible.builtin.shell: |
        set -eu
        ts="$(date -u +%Y-%m-%dT%H:%M:%S.000000Z)"
        log="/var/log/lantana/sensor/cowrie/cowrie.json"
        printf '{"eventid":"cowrie.canary.probe","timestamp":"%s","src_ip":"198.51.100.250","session":"%s-ext","message":"%s-ext"}\n' "$ts" "{{ canary_id }}" "{{ canary_id }}" >> "$log"
        printf '{"eventid":"cowrie.canary.probe","timestamp":"%s","src_ip":"::1","session":"%s-lo","message":"%s-lo"}\n' "$ts" "{{ canary_id }}" "{{ canary_id }}" >> "$log"
        printf '{"eventid":"cowrie.canary.probe","timestamp":"%s","src_ip":"10.99.99.99","session":"%s-rfc1918","message":"%s-rfc1918"}\n' "$ts" "{{ canary_id }}" "{{ canary_id }}" >> "$log"
        printf '{"eventid":"cowrie.canary.probe","timestamp":"%s","src_ip":"%s","session":"%s-wan","message":"%s-wan"}\n' "$ts" "{{ wan_ipv4 }}" "{{ canary_id }}" "{{ canary_id }}" >> "$log"
      changed_when: true

    - name: "Wait for Vector to flush canary event to Bronze"
      become: true
      ansible.builtin.shell: |
        set -eu
        for _ in $(seq 1 15); do
          if [ -f "{{ cowrie_bronze }}" ] && grep -q "{{ canary_id }}-ext" "{{ cowrie_bronze }}"; then
            sleep 2
            exit 0
          fi
          sleep 1
        done
        exit 1
      changed_when: false

    - name: "Count Vector canary occurrences in Bronze"
      become: true
      ansible.builtin.shell: |
        set -eu
        ext_count=$(grep -c "{{ canary_id }}-ext" "{{ cowrie_bronze }}" || true)
        lo_count=$(grep -c "{{ canary_id }}-lo" "{{ cowrie_bronze }}" || true)
        rfc1918_count=$(grep -c "{{ canary_id }}-rfc1918" "{{ cowrie_bronze }}" || true)
        wan_count=$(grep -c "{{ canary_id }}-wan" "{{ cowrie_bronze }}" || true)
        printf '%s %s %s %s\n' "$ext_count" "$lo_count" "$rfc1918_count" "$wan_count"
      register: vector_canary_counts
      changed_when: false

    - name: "Assert exact 1-in-1-out external multiplicity and 0 non-global/WAN leaks"
      ansible.builtin.assert:
        that:
          - "(vector_canary_counts.stdout.split()[0] | int) == 1"
          - "(vector_canary_counts.stdout.split()[1] | int) == 0"
          - "(vector_canary_counts.stdout.split()[2] | int) == 0"
          - "(vector_canary_counts.stdout.split()[3] | int) == 0"
        fail_msg: >-
          Vector 1-in-1-out canary failed (ext lo rfc1918 wan)={{ vector_canary_counts.stdout }}.
          Expected exactly '1 0 0 0'.

    # === 2. External SSH-2.0-Go Suricata Canary (sid:9000004) ===
    - name: "Record pre-canary sid:9000004 count in Suricata eve.json"
      become: true
      ansible.builtin.shell: |
        set -eu
        if [ -f "{{ suricata_eve }}" ]; then
          grep -c '"signature_id":9000004' "{{ suricata_eve }}" || true
        else
          echo 0
        fi
      register: suricata_pre_count
      changed_when: false

    - name: "Send external SSH-2.0-Go banner probe from Ansible controller to WAN:22"
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import socket, sys, time
            host = sys.argv[1]
            with socket.create_connection((host, 22), timeout=10) as sock:
                sock.settimeout(5)
                banner = sock.recv(256)
                if b"SSH-" not in banner:
                    raise SystemExit(f"Unexpected SSH banner: {banner!r}")
                sock.sendall(b"SSH-2.0-Go\r\n")
                time.sleep(0.5)
          - "{{ wan_ipv4 }}"
      changed_when: true

    - name: "Wait for Suricata sid:9000004 alert in eve.json and Bronze"
      become: true
      ansible.builtin.shell: |
        set -eu
        pre="{{ suricata_pre_count.stdout | int }}"
        for _ in $(seq 1 15); do
          now=$(grep -c '"signature_id":9000004' "{{ suricata_eve }}" 2>/dev/null || true)
          bronze_ok=0
          if [ -f "{{ suricata_bronze }}" ] && grep -q '"signature_id":9000004' "{{ suricata_bronze }}"; then
            bronze_ok=1
          fi
          if [ "$now" -gt "$pre" ] && [ "$bronze_ok" -eq 1 ]; then
            echo "post=$now pre=$pre"
            exit 0
          fi
          sleep 1
        done
        echo "TIMEOUT: pre=$pre now=$(grep -c '"signature_id":9000004' "{{ suricata_eve }}" 2>/dev/null || true)" >&2
        exit 1
      register: suricata_canary_result
      changed_when: false

    - name: "Check zero SURICATA TCPv4 invalid checksum alerts occurred during canary"
      become: true
      ansible.builtin.shell: |
        set -eu
        grep -c '"signature_id":2200074' "{{ suricata_eve }}" 2>/dev/null || true
      register: suricata_checksum_alerts
      changed_when: false

    # === 3. Dark Sensor Egress Containment Canary (stigma UID) ===
    - name: "Record pre-canary sensor egress drop counts in sensor-egress.log"
      become: true
      ansible.builtin.shell: |
        set -eu
        wan_pre=0
        lo_pre=0
        if [ -f "{{ sensor_egress_log }}" ]; then
          wan_pre=$(grep -c '\[LANTANA_OUTPUT_DROP_SENSOR_WAN\]' "{{ sensor_egress_log }}" || true)
          lo_pre=$(grep -c '\[LANTANA_OUTPUT_DROP_SENSOR_LO\]' "{{ sensor_egress_log }}" || true)
        fi
        printf '%s %s\n' "$wan_pre" "$lo_pre"
      register: egress_pre_counts
      changed_when: false

    - name: "Probe blocked WAN (443/80/53) and loopback (1) canary targets as sensor user"
      become: true
      become_user: "{{ system.users.sensor.name }}"
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import socket, sys

            failures = []
            # Use strictly allowlisted canary targets (RFC 5737 198.51.100.250 and
            # loopback TCP port 1) so canary probes never trigger false Critical
            # alerts on /health or Discord. Blanket loopback drops (incl. port 8501)
            # are enforced by the unconditional `oifname "lo" meta skuid stigma` rule.
            for host, port in (
                ("198.51.100.250", 443),
                ("198.51.100.250", 80),
                ("127.0.0.1", 1),
            ):
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.settimeout(1.5)
                try:
                    s.connect((host, port))
                    failures.append(f"TCP {host}:{port} unexpectedly succeeded")
                except OSError:
                    pass
                finally:
                    s.close()

            udp = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
            udp.settimeout(1.5)
            try:
                udp.sendto(b"\x00\x00\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00", ("198.51.100.250", 53))
            except OSError:
                pass
            finally:
                udp.close()

            if failures:
                sys.stderr.write("; ".join(failures) + "\n")
                sys.exit(1)
            print("ALL_BLOCKED")
      register: egress_probe_result
      changed_when: true

    - name: "Wait for sensor egress canary drops in sensor-egress.log"
      become: true
      ansible.builtin.shell: |
        set -eu
        wan_pre="{{ egress_pre_counts.stdout.split()[0] | int }}"
        lo_pre="{{ egress_pre_counts.stdout.split()[1] | int }}"
        for _ in $(seq 1 10); do
          if [ -f "{{ sensor_egress_log }}" ]; then
            wan_now=$(grep -c '\[LANTANA_OUTPUT_DROP_SENSOR_WAN\]' "{{ sensor_egress_log }}" || true)
            lo_now=$(grep -c '\[LANTANA_OUTPUT_DROP_SENSOR_LO\]' "{{ sensor_egress_log }}" || true)
            if [ "$wan_now" -gt "$wan_pre" ] && [ "$lo_now" -gt "$lo_pre" ]; then
              printf '%s %s\n' "$((wan_now - wan_pre))" "$((lo_now - lo_pre))"
              exit 0
            fi
          fi
          sleep 1
        done
        echo "TIMEOUT waiting for LANTANA_OUTPUT_DROP_SENSOR_{WAN,LO} in {{ sensor_egress_log }}" >&2
        exit 1
      register: egress_log_delta
      changed_when: false

    - name: "Verify zero sensor egress canary lines leaked into firewall.log or Bronze dataset=nftables"
      become: true
      ansible.builtin.shell: |
        set -eu
        sleep 2
        fw_leaks=0
        bronze_leaks=0
        if [ -f "{{ firewall_log }}" ]; then
          fw_leaks=$(grep -c 'LANTANA_OUTPUT_DROP_SENSOR_' "{{ firewall_log }}" || true)
        fi
        if [ -f "{{ nftables_bronze }}" ]; then
          bronze_leaks=$(grep -c 'LANTANA_OUTPUT_DROP_SENSOR_' "{{ nftables_bronze }}" || true)
        fi
        printf '%s %s\n' "$fw_leaks" "$bronze_leaks"
      register: egress_bronze_leaks
      changed_when: false

    - name: "Assert zero sensor egress lines leaked into firewall.log or Bronze"
      ansible.builtin.assert:
        that:
          - "(egress_bronze_leaks.stdout.split()[0] | int) == 0"
          - "(egress_bronze_leaks.stdout.split()[1] | int) == 0"
        fail_msg: >-
          Found LANTANA_OUTPUT_DROP_SENSOR_* leak (firewall.log / bronze)={{ egress_bronze_leaks.stdout }}
          — rsyslog must route sensor egress strictly to sensor-egress.log and Vector filter_nftables
          must drop all OUTPUT records so the host WAN IP never enters Bronze.

    - name: "Report active canary results"
      ansible.builtin.debug:
        msg: >-
          Canaries passed: Vector (ext/lo/rfc1918/wan)={{ vector_canary_counts.stdout }},
          Suricata sid:9000004 ({{ suricata_canary_result.stdout }}),
          TCPv4 invalid checksum alerts={{ suricata_checksum_alerts.stdout }},
          stigma egress blocked (wan lo)={{ egress_log_delta.stdout }} (0 Bronze leaks).
