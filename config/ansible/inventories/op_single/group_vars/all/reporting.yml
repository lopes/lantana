---
# --- CTI REPORTING CONFIGURATION ---
# Only data unique to reporting lives here.
# Operation context comes from narrative.yml, IPs from network.yml.
reporting:
  # Operator identity (who produces the intelligence)
  operator:
    name: "Operator Name"
    handle: "operator_handle"
    contact: "https://example.com"
    pgp_fingerprint: ""

  # Intelligence sharing policy
  sharing:
    tlp: "GREEN" # TLP:CLEAR, TLP:GREEN, TLP:AMBER, TLP:RED
    community: "Lantana Threat Intel"
    discord_channel: "lantana-intel"

  # OPSEC: pseudonym labels for infrastructure IPs in shared outputs
  # The actual IPs to redact are derived from network.yml at template render time
  pseudonym_map:
    wan: "honeypot-wan"
    lan: "honeypot-lan"
    sensor_01: "honeypot-sensor-01"
    collector_01: "honeypot-collector-01"

  # STIX 2.1 outbound IOC anti-poisoning & verification policy (optional; defaults shown)
  stix:
    # By default, outbound c2_ip / stager_url / stager_domain require corroboration
    # (VT/GTI/GreyNoise/AbuseIPDB or sensor-captured binary) and benign/shared infra
    # is suppressed. Set true only if running without enrichment keys and accepting
    # unverified outbound indicators (tagged 'unverified', lower confidence, 7d TTL).
    include_unverified_outbound: false
    unverified_confidence: 25
    # Additional operator-specific domains or IPs/CIDRs to suppress from STIX & API quota
    allowlist_domains: []
    allowlist_ips: []
